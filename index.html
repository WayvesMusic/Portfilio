<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayves - Music Portfolio</title>
    <style>
        :root {
            /* Synthwave / Dark Theme Palette */
            --bg-color: #0d0d12;
            --card-bg: #15151e;
            --text-primary: #f0f0f5;
            --text-secondary: #8a8a9d;
            --accent-cyan: #00e5ff;
            --accent-pink: #ff00ea;
            --accent-purple: #b026ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 229, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 234, 0.05), transparent 25%);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .portfolio-container {
            background-color: var(--card-bg);
            max-width: 850px;
            width: 100%;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 229, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Animated Visualizer Header */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
            height: 40px;
            margin-bottom: 20px;
        }

        .bar {
            width: 8px;
            background: linear-gradient(to top, var(--accent-purple), var(--accent-cyan));
            border-radius: 4px;
            animation: bounce 1s infinite alternate ease-in-out;
        }

        .bar:nth-child(1) { animation-delay: 0.1s; height: 40%; }
        .bar:nth-child(2) { animation-delay: 0.3s; height: 80%; }
        .bar:nth-child(3) { animation-delay: 0.0s; height: 100%; }
        .bar:nth-child(4) { animation-delay: 0.4s; height: 60%; }
        .bar:nth-child(5) { animation-delay: 0.2s; height: 70%; }

        @keyframes bounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1.title {
            font-size: 4rem;
            color: var(--text-primary);
            margin-bottom: 10px;
            letter-spacing: -2px;
            text-transform: uppercase;
            font-style: italic;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        h1.title span {
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.welcome {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin: 0 auto;
            max-width: 600px;
        }

        h2.section-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-purple);
            margin-bottom: 20px;
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h2.section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(176, 38, 255, 0.5), transparent);
        }

        /* Interactive Launchpad Widget */
        .widget-container {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 40px;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .launchpad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .pad {
            aspect-ratio: 1;
            background: #232330;
            border: 2px solid #333344;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
        }

        .pad:active {
            transform: scale(0.92);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* Pad Colors */
        .pad[data-color="cyan"]:active { background: var(--accent-cyan); border-color: #fff; box-shadow: 0 0 20px var(--accent-cyan); }
        .pad[data-color="pink"]:active { background: var(--accent-pink); border-color: #fff; box-shadow: 0 0 20px var(--accent-pink); }
        .pad[data-color="purple"]:active { background: var(--accent-purple); border-color: #fff; box-shadow: 0 0 20px var(--accent-purple); }
        .pad[data-color="yellow"]:active { background: #ffea00; border-color: #fff; box-shadow: 0 0 20px #ffea00; }

        /* Genres */
        .genres-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .genre-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .genre-card:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.1);
            cursor: pointer;
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: var(--text-primary);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        @media (max-width: 600px) {
            .portfolio-container { padding: 30px 20px; }
            h1.title { font-size: 2.8rem; }
            .launchpad { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        
        <div class="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <header>
            <h1 class="title">Way<span>ves</span></h1>
            <p class="welcome">Welcome to my portfolio! Listen, interact, and explore the worlds I've built through sound.</p>
        </header>

        <div class="widget-container">
            <div class="widget-header">
                <span>Mini Synth</span>
                <span>Click Pads to Play</span>
            </div>
            <div class="launchpad">
                <div class="pad" data-color="cyan" data-freq="261.63"></div> <div class="pad" data-color="pink" data-freq="329.63"></div> <div class="pad" data-color="purple" data-freq="392.00"></div> <div class="pad" data-color="yellow" data-freq="523.25"></div> </div>
        </div>

        <section>
            <h2 class="section-title">Soundscapes</h2>
            <div class="genres-grid">
                <div class="genre-card">Retro</div>
                <div class="genre-card">Simulator</div>
                <div class="genre-card">Boss Fight</div>
                <div class="genre-card">Cinematic</div>
            </div>
        </section>

        <section>
            <h2 class="section-title">Directory</h2>
            <div class="nav-links">
                <a href="#pricing">Pricing</a>
                <a href="#partners">Partners</a>
            </div>
        </section>

    </div>

    <script>
        // Set up the Web Audio API
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playTone(frequency) {
            // Initialize audio context on first click to comply with browser autoplay policies
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            
            // Create oscillator and gain node
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            // Synth settings
            oscillator.type = 'triangle'; // Gives a cool retro video game sound
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            // Envelope (fade out)
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);

            // Connect and play
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 1);
        }

        // Attach event listeners to pads
        document.querySelectorAll('.pad').forEach(pad => {
            pad.addEventListener('mousedown', () => {
                const freq = parseFloat(pad.getAttribute('data-freq'));
                playTone(freq);
            });
            // Support for mobile touch
            pad.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Prevent double firing
                const freq = parseFloat(pad.getAttribute('data-freq'));
                playTone(freq);
            });
        });
    </script>
</body>
</html>
