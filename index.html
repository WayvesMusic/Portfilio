<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#141414">
<title>WAYVES | Music Portfolio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
    --bg: #141414;
    --ink: #f4efe4;
    --grey: #3a3a3d;
    --grey-line: #555558;
    --grey-hi: #4c4c50;
    --active: #232323;
    --green: #35c94a;
    --muted: #9a968c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 32px;
}

.player-wrap {
    width: 100%;
    max-width: 440px;
}

/* ---------- genre filters ---------- */
.filters {
    display: flex;
    flex-wrap: nowrap;
    width: 100%;
    gap: 6px;
    margin-bottom: 14px;
}

.filter {
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    height: 36px;
    padding: 0 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--grey);
    color: var(--ink);
    font: 600 clamp(.6rem, 2.4vw, .85rem) "IBM Plex Sans", sans-serif;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
}

.filter:focus { outline: none; }

.filter:hover { background: var(--grey-hi); }

.filter.active {
    background: var(--green);
    color: #0d1a0f;
    border-color: var(--green);
}

/* ---------- stacked track buttons ---------- */
.tracks {
    display: flex;
    flex-direction: column;
}

.track {
    -webkit-tap-highlight-color: transparent;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 68px;
    padding: 10px 24px;
    border: 3px solid var(--ink);
    background: var(--grey);
    box-shadow: inset -3px -3px 0 rgba(255,255,255,.25);
    cursor: pointer;
    z-index: 1;
}

.tracks .track:not(:first-child) { margin-top: -3px; }
.tracks .track:first-child { border-radius: 20px 20px 0 0; }
.tracks .track:last-child { border-radius: 0 0 20px 20px; }
.tracks .track:only-child { border-radius: 20px; }

.track:hover { background: var(--grey-hi); }

.track.active {
    background: var(--active);
    z-index: 2;
}

.track-label {
    font: 700 1.15rem "Baloo 2", sans-serif;
    color: #fff;
    text-shadow: 0 1px 1px rgba(0,0,0,.15);
}

.track.active .track-label { color: var(--ink); text-shadow: none; }

.play-indicator {
    position: absolute;
    left: 20px;
    width: 0;
    height: 0;
    border-top: 11px solid transparent;
    border-bottom: 11px solid transparent;
    border-left: 16px solid var(--green);
    display: none;
}

.track.active.playing .play-indicator { display: block; }

/* ---------- player controls ---------- */
.player {
    margin-top: 22px;
    padding: 20px 22px;
    border: 3px solid var(--ink);
    border-radius: 20px;
    background: var(--active);
}

.player-title {
    font: 700 1.15rem "Baloo 2", sans-serif;
    text-align: center;
}

.player-genre {
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    margin-top: 2px;
}

.progress-wrap { margin-top: 16px; }

input[type="range"] {
    width: 100%;
    appearance: none;
    height: 8px;
    border-radius: 6px;
    background: var(--grey);
    border: 2px solid var(--ink);
    outline: none;
    cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--green);
    border: 2px solid var(--ink);
}

.time-row {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: .72rem;
    margin-top: 6px;
}

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 18px;
}

.control {
    -webkit-tap-highlight-color: transparent;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 3px solid var(--ink);
    border-radius: 50%;
    background: var(--grey);
    color: #fff;
    cursor: pointer;
}

.control:hover { background: var(--grey-hi); }

.control.main {
    width: 58px;
    height: 58px;
    background: var(--green);
    font-size: 1.2rem;
}

.volume {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    color: var(--muted);
    font-size: .82rem;
}

.volume input { flex: 1; }

.toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 20px);
    opacity: 0;
    pointer-events: none;
    padding: 10px 16px;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: var(--active);
    font-size: .82rem;
    transition: .2s ease;
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- custom cursor (desktop / mouse only) ---------- */
@media (pointer: fine) and (hover: hover) {
    body.custom-cursor-ready { cursor: none; }
    body.custom-cursor-ready a,
    body.custom-cursor-ready button,
    body.custom-cursor-ready .track,
    body.custom-cursor-ready input[type="range"] { cursor: none; }
}

.custom-cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 20px;
    height: 20px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-1000px, -1000px);
    will-change: transform;
    display: none;
}

body.custom-cursor-ready .custom-cursor { display: block; }
</style>
</head>
<body>

<div class="player-wrap">
    <div class="filters" id="musicFilters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="Retro">Retro</button>
        <button class="filter" data-filter="Cinematic">Cinematic</button>
        <button class="filter" data-filter="Simulator">Simulator</button>
        <button class="filter" data-filter="Boss Fight">Boss Fight</button>
    </div>

    <div class="tracks" id="musicList">
        <div class="track" data-title="Retro" data-genre="Retro / Game" data-cat="Retro" data-src="Retro.mp3">
            <span class="play-indicator"></span><span class="track-label">Retro</span>
        </div>
        <div class="track" data-title="Retro 1" data-genre="Retro / Game" data-cat="Retro" data-src="Retro%201.mp3">
            <span class="play-indicator"></span><span class="track-label">Retro 1</span>
        </div>
        <div class="track" data-title="Cinematic" data-genre="Cinematic / Atmosphere" data-cat="Cinematic" data-src="Cinematic.mp3">
            <span class="play-indicator"></span><span class="track-label">Cinematic</span>
        </div>
        <div class="track" data-title="Cinematic 1" data-genre="Cinematic / Atmosphere" data-cat="Cinematic" data-src="Cinematic%201.mp3">
            <span class="play-indicator"></span><span class="track-label">Cinematic 1</span>
        </div>
        <div class="track" data-title="Simulator" data-genre="Simulator / Gameplay" data-cat="Simulator" data-src="Simulator.mp3">
            <span class="play-indicator"></span><span class="track-label">Simulator</span>
        </div>
        <div class="track" data-title="Simulator 1" data-genre="Simulator / Gameplay" data-cat="Simulator" data-src="Simulator%201.mp3">
            <span class="play-indicator"></span><span class="track-label">Simulator 1</span>
        </div>
        <div class="track" data-title="Boss Fight" data-genre="Boss Fight / Action" data-cat="Boss Fight" data-src="Boss%20Fight.mp3">
            <span class="play-indicator"></span><span class="track-label">Boss Fight</span>
        </div>
        <div class="track" data-title="Boss Fight 1" data-genre="Boss Fight / Action" data-cat="Boss Fight" data-src="Boss%20Fight%201.mp3">
            <span class="play-indicator"></span><span class="track-label">Boss Fight 1</span>
        </div>
    </div>

    <div class="player">
        <div class="player-title" id="playerTitle">Nothing selected</div>
        <div class="player-genre" id="playerGenre">Choose a track above</div>

        <div class="progress-wrap">
            <input id="progress" type="range" min="0" max="100" value="0" step=".1" aria-label="Track progress">
            <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
        </div>

        <div class="controls">
            <button class="control" id="prevBtn" aria-label="Previous track">↶</button>
            <button class="control main" id="playBtn" aria-label="Play">▶</button>
            <button class="control" id="nextBtn" aria-label="Next track">↷</button>
        </div>

        <div class="volume">
            <span>Vol</span>
            <input id="volume" type="range" min="0" max="1" value=".8" step=".01" aria-label="Volume">
        </div>

        <audio id="audio" preload="metadata"></audio>
    </div>
</div>

<audio id="clickSound" src="ClickSound.mp3" preload="auto"></audio>
<div class="toast" id="toast"></div>
<img class="custom-cursor" id="customCursor" src="Cursor.png" alt="">

<script>
const audio = document.getElementById("audio");
const clickSound = document.getElementById("clickSound");
const tracks = [...document.querySelectorAll(".track")];
const filterButtons = [...document.querySelectorAll(".filter")];
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const playerTitle = document.getElementById("playerTitle");
const playerGenre = document.getElementById("playerGenre");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");
const toast = document.getElementById("toast");

let currentIndex = -1;
let toastTimer;

audio.volume = Number(volume.value);

/* Click sound — cloning the node lets rapid taps overlap instead of
   cutting each other off, and calling play() synchronously inside the
   event handler is what makes this reliable on iOS/Android too. */
function playClickSound() {
    try {
        const sound = clickSound.cloneNode(true);
        sound.volume = 0.5;
        sound.play().catch(() => {});
    } catch {}
}

document.addEventListener("click", event => {
    if (event.target.closest(".track, .filter, .control")) playClickSound();
}, true);

function filterTracks(filter) {
    tracks.forEach(track => {
        track.style.display = (filter === "all" || track.dataset.cat === filter) ? "" : "none";
    });
}

filterButtons.forEach(button => button.addEventListener("click", () => {
    filterButtons.forEach(item => item.classList.remove("active"));
    button.classList.add("active");
    filterTracks(button.dataset.filter);
}));

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
    return `${mins}:${secs}`;
}

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

function setPlayingVisuals(playing) {
    playBtn.textContent = playing ? "Ⅱ" : "▶";
    playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
    tracks.forEach(t => t.classList.toggle("playing", playing && t.classList.contains("active")));
}

function selectTrack(index, autoplay = false) {
    if (index < 0 || index >= tracks.length) return;

    currentIndex = index;
    const track = tracks[index];
    const title = track.dataset.title;
    const genre = track.dataset.genre;
    const src = track.dataset.src;

    tracks.forEach(item => item.classList.remove("active", "playing"));
    track.classList.add("active");

    playerTitle.textContent = title;
    playerGenre.textContent = genre;

    if (audio.src !== new URL(src, window.location.href).href) {
        audio.src = src;
        progress.value = 0;
        currentTime.textContent = "0:00";
        duration.textContent = "0:00";
    }

    if (autoplay) {
        audio.play().then(() => setPlayingVisuals(true)).catch(() => {
            setPlayingVisuals(false);
            showToast("Audio could not start. Check that the MP3 file is beside index.html.");
        });
    } else {
        setPlayingVisuals(false);
    }
}

function togglePlay() {
    if (currentIndex === -1) {
        selectTrack(0, true);
        return;
    }

    if (audio.paused) {
        audio.play().then(() => setPlayingVisuals(true)).catch(() => {
            showToast("Audio could not start. Check the MP3 filename.");
        });
    } else {
        audio.pause();
        setPlayingVisuals(false);
    }
}

function changeTrack(direction) {
    if (!tracks.length) return;
    const next = currentIndex === -1
        ? 0
        : (currentIndex + direction + tracks.length) % tracks.length;
    selectTrack(next, true);
}

tracks.forEach((track, index) => {
    track.addEventListener("click", () => {
        if (currentIndex === index) togglePlay();
        else selectTrack(index, false);
    });
});

playBtn.addEventListener("click", togglePlay);
prevBtn.addEventListener("click", () => changeTrack(-1));
nextBtn.addEventListener("click", () => changeTrack(1));

audio.addEventListener("timeupdate", () => {
    if (audio.duration) progress.value = (audio.currentTime / audio.duration) * 100;
    currentTime.textContent = formatTime(audio.currentTime);
});

audio.addEventListener("loadedmetadata", () => {
    duration.textContent = formatTime(audio.duration);
});

audio.addEventListener("play", () => setPlayingVisuals(true));
audio.addEventListener("pause", () => setPlayingVisuals(false));

audio.addEventListener("ended", () => {
    if (currentIndex < tracks.length - 1) selectTrack(currentIndex + 1, true);
    else {
        audio.currentTime = 0;
        setPlayingVisuals(false);
    }
});

audio.addEventListener("error", () => {
    setPlayingVisuals(false);
    showToast("Could not load this audio file. Make sure the filename matches exactly.");
});

progress.addEventListener("input", () => {
    if (audio.duration) audio.currentTime = (Number(progress.value) / 100) * audio.duration;
});

volume.addEventListener("input", () => {
    audio.volume = Number(volume.value);
});

/* Custom cursor — only for devices with a real mouse (pointer: fine,
   hover: hover). Touch devices keep their normal on-screen cursor. */
const cursorQuery = window.matchMedia("(pointer: fine) and (hover: hover)");
const customCursor = document.getElementById("customCursor");

function enableCustomCursor() {
    document.body.classList.add("custom-cursor-ready");
    document.addEventListener("mousemove", moveCustomCursor);
}

function disableCustomCursor() {
    document.body.classList.remove("custom-cursor-ready");
    document.removeEventListener("mousemove", moveCustomCursor);
}

function moveCustomCursor(event) {
    customCursor.style.transform = `translate(${event.clientX - 4}px, ${event.clientY - 2}px)`;
}

if (cursorQuery.matches) enableCustomCursor();
cursorQuery.addEventListener("change", e => e.matches ? enableCustomCursor() : disableCustomCursor());
</script>
</body>
</html>
