<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#008080">
<title>Media Player & Idle Breakout</title>
<style>
:root {
    --face: #c0c0c0;
    --shadow: #808080;
    --dark-shadow: #0a0a0a;
    --light: #dfdfdf;
    --highlight: #ffffff;
    --navy: #000080;
    --navy-2: #1084d0;
    --desktop: #008080;
    --lcd-bg: #0a1f0a;
    --lcd-text: #39ff6a;
    --text: #000000;
    --muted: #4b4b4b;
    --felt: #008080; /* Matched to desktop for breakout bg */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    background: var(--desktop);
    color: var(--text);
    font-family: Tahoma, "MS Sans Serif", Arial, sans-serif;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 12px;
}

.app-stack {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
}

.raised {
    background: var(--face);
    box-shadow:
        inset -1px -1px 0 var(--dark-shadow),
        inset 1px 1px 0 var(--highlight),
        inset -2px -2px 0 var(--shadow),
        inset 2px 2px 0 var(--light);
}

.sunken {
    background: var(--face);
    box-shadow:
        inset -1px -1px 0 var(--highlight),
        inset 1px 1px 0 var(--dark-shadow),
        inset -2px -2px 0 var(--light),
        inset 2px 2px 0 var(--shadow);
}

.player-wrap {
    width: 100%;
    padding: 3px;
}

.title-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 22px;
    padding: 2px 3px 2px 5px;
    margin-bottom: 3px;
    background: linear-gradient(90deg, var(--navy), var(--navy-2));
    color: #fff;
}

.title-bar-text {
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .01em;
}

.title-bar-controls {
    display: flex;
    gap: 3px;
    pointer-events: none;
}

.title-bar-controls span {
    width: 16px;
    height: 14px;
    display: grid;
    place-items: center;
    font-size: 10px;
    line-height: 1;
    color: #000;
}

.window-body { padding: 8px; }

/* Player Styles */
.filters {
    display: flex;
    flex-wrap: nowrap;
    width: 100%;
    gap: 2px;
    margin-bottom: 8px;
}

.filter {
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    height: 24px;
    padding: 0 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    font: 700 clamp(.56rem, 2.2vw, .75rem) Tahoma, "MS Sans Serif", sans-serif;
    color: var(--text);
    cursor: pointer;
}

.filter:focus { outline: none; }
.filter:active { transform: translate(1px, 1px); }

.filter.active {
    background: var(--navy);
    color: #fff;
}

.tracks {
    display: flex;
    flex-direction: column;
    background: #fff;
    padding: 2px;
    max-height: 260px;
    overflow-y: auto;
}

.track {
    -webkit-tap-highlight-color: transparent;
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 26px;
    padding: 3px 8px;
    color: var(--text);
    cursor: pointer;
}

.track:hover { background: #dcdcdc; }

.track.active {
    background: var(--navy);
    color: #fff;
}

.track-label {
    font: 400 12px Tahoma, "MS Sans Serif", sans-serif;
}

.play-indicator {
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 7px solid #fff;
    visibility: hidden;
    flex: 0 0 auto;
}

.track.active.playing .play-indicator { visibility: visible; }

.player {
    margin-top: 8px;
    padding: 8px;
}

.lcd {
    padding: 8px 10px;
    background: var(--lcd-bg);
    color: var(--lcd-text);
    font-family: "Courier New", monospace;
    text-align: center;
    overflow: hidden;
}

.player-title {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-genre {
    font-size: 10px;
    margin-top: 2px;
    opacity: .85;
}

.progress-wrap { margin-top: 10px; padding: 0 2px; }

input[type="range"] {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    height: 6px;
    background: var(--face);
    box-shadow:
        inset -1px -1px 0 var(--highlight),
        inset 1px 1px 0 var(--dark-shadow),
        inset -2px -2px 0 var(--light),
        inset 2px 2px 0 var(--shadow);
    outline: none;
    cursor: pointer;
    margin: 6px 0;
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 16px;
    background: var(--face);
    box-shadow:
        inset -1px -1px 0 var(--dark-shadow),
        inset 1px 1px 0 var(--highlight),
        inset -2px -2px 0 var(--shadow),
        inset 2px 2px 0 var(--light);
}

input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 16px;
    border: 0;
    background: var(--face);
    box-shadow:
        inset -1px -1px 0 var(--dark-shadow),
        inset 1px 1px 0 var(--highlight),
        inset -2px -2px 0 var(--shadow),
        inset 2px 2px 0 var(--light);
}

.time-row {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 11px;
    padding: 0 2px;
}

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
}

.control {
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    width: 36px;
    height: 30px;
    display: grid;
    place-items: center;
    border: 0;
    background: var(--face);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    box-shadow:
        inset -1px -1px 0 var(--dark-shadow),
        inset 1px 1px 0 var(--highlight),
        inset -2px -2px 0 var(--shadow),
        inset 2px 2px 0 var(--light);
}

.control:active {
    box-shadow:
        inset -1px -1px 0 var(--highlight),
        inset 1px 1px 0 var(--dark-shadow),
        inset -2px -2px 0 var(--light),
        inset 2px 2px 0 var(--shadow);
    transform: translate(1px, 1px);
}

.control.main {
    width: 46px;
    height: 34px;
    font-size: 14px;
}

.volume {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding: 0 2px;
    color: var(--muted);
    font-size: 11px;
}

.volume input { flex: 1; }

.status-bar {
    margin-top: 8px;
    padding: 4px 6px;
    font-size: 11px;
    color: var(--muted);
}

.toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 20px);
    opacity: 0;
    pointer-events: none;
    padding: 8px 14px;
    background: var(--face);
    box-shadow:
        inset -1px -1px 0 var(--dark-shadow),
        inset 1px 1px 0 var(--highlight),
        inset -2px -2px 0 var(--shadow),
        inset 2px 2px 0 var(--light);
    font-size: 12px;
    color: var(--text);
    transition: .15s ease;
    max-width: 320px;
    z-index: 500;
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

.toggle-btn {
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    width: 100%;
    height: 34px;
    border: 0;
    font: 700 13px Tahoma, "MS Sans Serif", sans-serif;
    color: var(--text);
    cursor: pointer;
}

.toggle-btn:active {
    box-shadow:
        inset -1px -1px 0 var(--highlight),
        inset 1px 1px 0 var(--dark-shadow),
        inset -2px -2px 0 var(--light),
        inset 2px 2px 0 var(--shadow) !important;
    transform: translate(1px, 1px);
}

.mini-btn {
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    border: 0;
    height: 24px;
    padding: 0 10px;
    font: 700 11px Tahoma, "MS Sans Serif", sans-serif;
    color: var(--text);
    cursor: pointer;
}

.mini-btn:active:not(:disabled) {
    box-shadow:
        inset -1px -1px 0 var(--highlight),
        inset 1px 1px 0 var(--dark-shadow),
        inset -2px -2px 0 var(--light),
        inset 2px 2px 0 var(--shadow) !important;
    transform: translate(1px, 1px);
}

.mini-btn:disabled {
    color: var(--shadow);
    text-shadow: 1px 1px 0 var(--highlight);
    cursor: not-allowed;
}

/* Idle Breakout Styles */
.breakout-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: 700;
}

.canvas-container {
    width: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 8px;
}

canvas {
    display: block;
    width: 100%;
    max-width: 380px;
    height: auto;
    cursor: crosshair;
}

.shop-controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
}

@media (pointer: fine) and (hover: hover) {
    body.custom-cursor-ready { cursor: none; }
    body.custom-cursor-ready a,
    body.custom-cursor-ready button,
    body.custom-cursor-ready .track,
    body.custom-cursor-ready input[type="range"] { cursor: none; }
}

.custom-cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 20px;
    height: 20px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-1000px, -1000px);
    will-change: transform;
    display: none;
}

body.custom-cursor-ready .custom-cursor { display: block; }
</style>
</head>
<body>

<div class="app-stack">

    <div class="player-wrap raised" id="playerWindow">
        <div class="title-bar">
            <span class="title-bar-text">Media Player</span>
            <div class="title-bar-controls">
                <span class="raised">_</span>
                <span class="raised">□</span>
                <span class="raised">✕</span>
            </div>
        </div>

        <div class="window-body">
            <div class="filters raised" id="musicFilters">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="Retro">Retro</button>
                <button class="filter" data-filter="Cinematic">Cinematic</button>
                <button class="filter" data-filter="Simulator">Simulator</button>
                <button class="filter" data-filter="Boss Fight">Boss Fight</button>
            </div>

            <div class="tracks sunken" id="musicList">
                <div class="track" data-title="Retro" data-genre="Retro / Game" data-cat="Retro" data-src="Retro.mp3">
                    <span class="play-indicator"></span><span class="track-label">Retro</span>
                </div>
                <div class="track" data-title="Retro 1" data-genre="Retro / Game" data-cat="Retro" data-src="Retro%201.mp3">
                    <span class="play-indicator"></span><span class="track-label">Retro 1</span>
                </div>
                <div class="track" data-title="Cinematic" data-genre="Cinematic / Atmosphere" data-cat="Cinematic" data-src="Cinematic.mp3">
                    <span class="play-indicator"></span><span class="track-label">Cinematic</span>
                </div>
                <div class="track" data-title="Cinematic 1" data-genre="Cinematic / Atmosphere" data-cat="Cinematic" data-src="Cinematic%201.mp3">
                    <span class="play-indicator"></span><span class="track-label">Cinematic 1</span>
                </div>
                <div class="track" data-title="Simulator" data-genre="Simulator / Gameplay" data-cat="Simulator" data-src="Simulator.mp3">
                    <span class="play-indicator"></span><span class="track-label">Simulator</span>
                </div>
                <div class="track" data-title="Simulator 1" data-genre="Simulator / Gameplay" data-cat="Simulator" data-src="Simulator%201.mp3">
                    <span class="play-indicator"></span><span class="track-label">Simulator 1</span>
                </div>
                <div class="track" data-title="Simulator 2" data-genre="Simulator / Gameplay" data-cat="Simulator" data-src="Simulator%202.mp3">
                    <span class="play-indicator"></span><span class="track-label">Simulator 2</span>
                </div>
                <div class="track" data-title="Boss Fight" data-genre="Boss Fight / Action" data-cat="Boss Fight" data-src="Boss%20Fight.mp3">
                    <span class="play-indicator"></span><span class="track-label">Boss Fight</span>
                </div>
                <div class="track" data-title="Boss Fight 1" data-genre="Boss Fight / Action" data-cat="Boss Fight" data-src="Boss%20Fight%201.mp3">
                    <span class="play-indicator"></span><span class="track-label">Boss Fight 1</span>
                </div>
            </div>

            <div class="player raised">
                <div class="lcd sunken">
                    <div class="player-title" id="playerTitle">NO TRACK LOADED</div>
                    <div class="player-genre" id="playerGenre">SELECT A TRACK ABOVE</div>
                </div>

                <div class="progress-wrap">
                    <input id="progress" type="range" min="0" max="100" value="0" step=".1" aria-label="Track progress">
                    <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
                </div>

                <div class="controls">
                    <button class="control" id="prevBtn" aria-label="Previous track">◀◀</button>
                    <button class="control main" id="playBtn" aria-label="Play">▶</button>
                    <button class="control" id="nextBtn" aria-label="Next track">▶▶</button>
                </div>

                <div class="volume">
                    <span>Vol</span>
                    <input id="volume" type="range" min="0" max="1" value=".8" step=".01" aria-label="Volume">
                </div>

                <audio id="audio" preload="metadata"></audio>
            </div>

            <div class="status-bar sunken">Ready</div>
        </div>
    </div>

    <div class="player-wrap raised" id="gameWindow" style="display:none">
        <div class="title-bar">
            <span class="title-bar-text">Idle Breakout</span>
            <div class="title-bar-controls">
                <span class="raised">_</span>
                <span class="raised">□</span>
                <span class="raised">✕</span>
            </div>
        </div>

        <div class="window-body">
            <div class="breakout-header">
                <span id="moneyDisplay">Money: $0</span>
                <span id="levelDisplay">Level: 1</span>
            </div>

            <div class="canvas-container sunken">
                <canvas id="gameCanvas" width="380" height="240"></canvas>
            </div>

            <div class="shop-controls">
                <button class="mini-btn raised" id="btnBuyBall">Buy Ball ($10)</button>
                <button class="mini-btn raised" id="btnUpgradeDmg">Ball Dmg ($25)</button>
                <button class="mini-btn raised" id="btnUpgradeClick">Click Dmg ($15)</button>
            </div>
        </div>

        <div class="status-bar sunken" id="gameStatus">Click bricks to deal damage. Buy upgrades to automate!</div>
    </div>

    <button class="toggle-btn raised" id="toggleBtn">Play Game</button>

</div>

<audio id="clickSound" src="ClickSound.mp3" preload="auto"></audio>
<audio id="errorSound" src="ErrorSound.mp3" preload="auto"></audio>
<div class="toast" id="toast"></div>
<img class="custom-cursor" id="customCursor" src="Cursor.png" alt="">

<script>
// --- MEDIA PLAYER LOGIC ---
const audio = document.getElementById("audio");
const clickSound = document.getElementById("clickSound");
const errorSound = document.getElementById("errorSound");
const tracks = [...document.querySelectorAll(".track")];
const filterButtons = [...document.querySelectorAll(".filter")];
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const playerTitle = document.getElementById("playerTitle");
const playerGenre = document.getElementById("playerGenre");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");
const toast = document.getElementById("toast");

let currentIndex = -1;
let toastTimer;

audio.volume = Number(volume.value);

function playClickSound() {
    try {
        const sound = clickSound.cloneNode(true);
        sound.volume = 0.5;
        sound.play().catch(() => {});
    } catch {}
}

document.addEventListener("click", event => {
    if (event.target.closest(".track, .filter, .control, .toggle-btn, .mini-btn")) playClickSound();
}, true);

function filterTracks(filter) {
    tracks.forEach(track => {
        track.style.display = (filter === "all" || track.dataset.cat === filter) ? "" : "none";
    });
}

filterButtons.forEach(button => button.addEventListener("click", () => {
    filterButtons.forEach(item => item.classList.remove("active"));
    button.classList.add("active");
    filterTracks(button.dataset.filter);
}));

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
    return `${mins}:${secs}`;
}

function playErrorSound() {
    try {
        const sound = errorSound.cloneNode(true);
        sound.volume = 0.6;
        sound.play().catch(() => {});
    } catch {}
}

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    playErrorSound();
}

function setPlayingVisuals(playing) {
    playBtn.textContent = playing ? "Ⅱ" : "▶";
    playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
    tracks.forEach(t => t.classList.toggle("playing", playing && t.classList.contains("active")));
}

function selectTrack(index, autoplay = false) {
    if (index < 0 || index >= tracks.length) return;

    currentIndex = index;
    const track = tracks[index];
    const title = track.dataset.title;
    const genre = track.dataset.genre;
    const src = track.dataset.src;

    tracks.forEach(item => item.classList.remove("active", "playing"));
    track.classList.add("active");

    playerTitle.textContent = title;
    playerGenre.textContent = genre;

    if (audio.src !== new URL(src, window.location.href).href) {
        audio.src = src;
        progress.value = 0;
        currentTime.textContent = "0:00";
        duration.textContent = "0:00";
    }

    if (autoplay) {
        audio.play().then(() => setPlayingVisuals(true)).catch(() => {
            setPlayingVisuals(false);
            showToast("Audio could not start. Check that the MP3 file is beside index.html.");
        });
    } else {
        setPlayingVisuals(false);
    }
}

function togglePlay() {
    if (currentIndex === -1) {
        selectTrack(0, true);
        return;
    }

    if (audio.paused) {
        audio.play().then(() => setPlayingVisuals(true)).catch(() => {
            showToast("Audio could not start. Check the MP3 filename.");
        });
    } else {
        audio.pause();
        setPlayingVisuals(false);
    }
}

function changeTrack(direction) {
    if (!tracks.length) return;
    const next = currentIndex === -1
        ? 0
        : (currentIndex + direction + tracks.length) % tracks.length;
    selectTrack(next, true);
}

tracks.forEach((track, index) => {
    track.addEventListener("click", () => {
        if (currentIndex === index) togglePlay();
        else selectTrack(index, false);
    });
});

playBtn.addEventListener("click", togglePlay);
prevBtn.addEventListener("click", () => changeTrack(-1));
nextBtn.addEventListener("click", () => changeTrack(1));

audio.addEventListener("timeupdate", () => {
    if (audio.duration) progress.value = (audio.currentTime / audio.duration) * 100;
    currentTime.textContent = formatTime(audio.currentTime);
});

audio.addEventListener("loadedmetadata", () => {
    duration.textContent = formatTime(audio.duration);
});

audio.addEventListener("play", () => setPlayingVisuals(true));
audio.addEventListener("pause", () => setPlayingVisuals(false));

audio.addEventListener("ended", () => {
    if (currentIndex < tracks.length - 1) selectTrack(currentIndex + 1, true);
    else {
        audio.currentTime = 0;
        setPlayingVisuals(false);
    }
});

audio.addEventListener("error", () => {
    setPlayingVisuals(false);
    showToast("Could not load this audio file. Make sure the filename matches exactly.");
});

progress.addEventListener("input", () => {
    if (audio.duration) audio.currentTime = (Number(progress.value) / 100) * audio.duration;
});

volume.addEventListener("input", () => {
    audio.volume = Number(volume.value);
});


// --- CURSOR LOGIC ---
const cursorQuery = window.matchMedia("(pointer: fine) and (hover: hover)");
const customCursor = document.getElementById("customCursor");

function enableCustomCursor() {
    document.body.classList.add("custom-cursor-ready");
    document.addEventListener("mousemove", moveCustomCursor);
}

function disableCustomCursor() {
    document.body.classList.remove("custom-cursor-ready");
    document.removeEventListener("mousemove", moveCustomCursor);
}

function moveCustomCursor(event) {
    customCursor.style.transform = `translate(${event.clientX - 4}px, ${event.clientY - 2}px)`;
}

if (cursorQuery.matches) enableCustomCursor();
cursorQuery.addEventListener("change", e => e.matches ? enableCustomCursor() : disableCustomCursor());


// --- VIEW TOGGLE LOGIC ---
const playerWindow = document.getElementById("playerWindow");
const gameWindow = document.getElementById("gameWindow");
const toggleBtn = document.getElementById("toggleBtn");
let gameStarted = false;
let showingGame = false;

toggleBtn.addEventListener("click", () => {
    showingGame = !showingGame;
    playerWindow.style.display = showingGame ? "none" : "";
    gameWindow.style.display = showingGame ? "" : "none";
    toggleBtn.textContent = showingGame ? "Back to Player" : "Play Game";
    
    if (showingGame) {
        if (!gameStarted) {
            gameStarted = true;
            initIdleBreakout();
        }
        ib_lastTime = performance.now();
        ib_reqId = requestAnimationFrame(ib_loop);
    } else {
        cancelAnimationFrame(ib_reqId);
    }
});


// --- IDLE BREAKOUT LOGIC ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const moneyDisplay = document.getElementById("moneyDisplay");
const levelDisplay = document.getElementById("levelDisplay");
const btnBuyBall = document.getElementById("btnBuyBall");
const btnUpgradeDmg = document.getElementById("btnUpgradeDmg");
const btnUpgradeClick = document.getElementById("btnUpgradeClick");

let ib_money = 0;
let ib_level = 1;
let ib_clickDmg = 1;
let ib_ballDmg = 1;
let ib_balls = [];
let ib_bricks = [];
let ib_costs = { ball: 10, bDmg: 25, cDmg: 15 };
let ib_lastTime = 0;
let ib_reqId = null;

const IB_COLS = 6;
const IB_ROWS = 4;
const BRICK_W = 50;
const BRICK_H = 20;
const PADDING = 8;
const OFFSET_X = 20;
const OFFSET_Y = 20;

function initIdleBreakout() {
    spawnBricks();
    updateUI();
}

function spawnBricks() {
    ib_bricks = [];
    const baseHp = ib_level * 5;
    for(let r = 0; r < IB_ROWS; r++) {
        for(let c = 0; c < IB_COLS; c++) {
            ib_bricks.push({
                x: OFFSET_X + c * (BRICK_W + PADDING),
                y: OFFSET_Y + r * (BRICK_H + PADDING),
                w: BRICK_W,
                h: BRICK_H,
                hp: baseHp + Math.floor(Math.random() * (ib_level * 5)),
                maxHp: 0 
            });
        }
    }
    ib_bricks.forEach(b => b.maxHp = b.hp);
}

function addBall() {
    ib_balls.push({
        x: canvas.width / 2,
        y: canvas.height - 20,
        dx: (Math.random() > 0.5 ? 1 : -1) * (100 + Math.random() * 50),
        dy: -150 - Math.random() * 50,
        r: 4
    });
}

function updateUI() {
    moneyDisplay.textContent = `Money: $${ib_money}`;
    levelDisplay.textContent = `Level: ${ib_level}`;
    
    btnBuyBall.textContent = `Buy Ball ($${ib_costs.ball})`;
    btnBuyBall.disabled = ib_money < ib_costs.ball;
    
    btnUpgradeDmg.textContent = `Ball Dmg ($${ib_costs.bDmg}) [${ib_ballDmg}]`;
    btnUpgradeDmg.disabled = ib_money < ib_costs.bDmg;
    
    btnUpgradeClick.textContent = `Click Dmg ($${ib_costs.cDmg}) [${ib_clickDmg}]`;
    btnUpgradeClick.disabled = ib_money < ib_costs.cDmg;
}

// Upgrades
btnBuyBall.addEventListener("click", () => {
    if(ib_money >= ib_costs.ball) {
        ib_money -= ib_costs.ball;
        addBall();
        ib_costs.ball = Math.floor(ib_costs.ball * 1.5);
        updateUI();
    }
});
btnUpgradeDmg.addEventListener("click", () => {
    if(ib_money >= ib_costs.bDmg) {
        ib_money -= ib_costs.bDmg;
        ib_ballDmg++;
        ib_costs.bDmg = Math.floor(ib_costs.bDmg * 1.6);
        updateUI();
    }
});
btnUpgradeClick.addEventListener("click", () => {
    if(ib_money >= ib_costs.cDmg) {
        ib_money -= ib_costs.cDmg;
        ib_clickDmg++;
        ib_costs.cDmg = Math.floor(ib_costs.cDmg * 1.4);
        updateUI();
    }
});

// Click Damage
canvas.addEventListener("mousedown", (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    
    const mouseX = (e.clientX - rect.left) * scaleX;
    const mouseY = (e.clientY - rect.top) * scaleY;

    for (let i = 0; i < ib_bricks.length; i++) {
        let b = ib_bricks[i];
        if (mouseX >= b.x && mouseX <= b.x + b.w && mouseY >= b.y && mouseY <= b.y + b.h) {
            b.hp -= ib_clickDmg;
            playClickSound(); // Make click sound on hit
            checkBrickDeath(i);
            break;
        }
    }
});

function checkBrickDeath(index) {
    if (ib_bricks[index].hp <= 0) {
        // Gain money based on brick max health
        ib_money += Math.max(1, Math.floor(ib_bricks[index].maxHp / 2));
        ib_bricks.splice(index, 1);
        updateUI();
        
        if (ib_bricks.length === 0) {
            ib_level++;
            spawnBricks();
            updateUI();
        }
    }
}

function ib_update(dt) {
    for (let ball of ib_balls) {
        ball.x += ball.dx * dt;
        ball.y += ball.dy * dt;

        // Wall collisions
        if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx *= -1; }
        if (ball.x + ball.r > canvas.width) { ball.x = canvas.width - ball.r; ball.dx *= -1; }
        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy *= -1; }
        if (ball.y + ball.r > canvas.height) { ball.y = canvas.height - ball.r; ball.dy *= -1; }

        // Brick collisions
        for (let i = 0; i < ib_bricks.length; i++) {
            let b = ib_bricks[i];
            
            // Simple AABB collision detection for circle and rect
            let testX = ball.x;
            let testY = ball.y;

            if (ball.x < b.x) testX = b.x; 
            else if (ball.x > b.x + b.w) testX = b.x + b.w; 
            if (ball.y < b.y) testY = b.y; 
            else if (ball.y > b.y + b.h) testY = b.y + b.h;

            let distX = ball.x - testX;
            let distY = ball.y - testY;
            let distance = Math.sqrt((distX * distX) + (distY * distY));

            if (distance <= ball.r) {
                // Bounce
                if (Math.abs(distX) > Math.abs(distY)) {
                    ball.dx *= -1;
                } else {
                    ball.dy *= -1;
                }
                
                b.hp -= ib_ballDmg;
                checkBrickDeath(i);
                break; // Only hit one brick per frame to prevent sticking
            }
        }
    }
}

function ib_draw() {
    // Clear background
    ctx.fillStyle = "#008080";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Bricks (Win98 Button Style)
    for (let b of ib_bricks) {
        ctx.fillStyle = "#c0c0c0";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        
        // 3D Borders
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(b.x, b.y, b.w, 2); // top
        ctx.fillRect(b.x, b.y, 2, b.h); // left
        
        ctx.fillStyle = "#808080";
        ctx.fillRect(b.x, b.y + b.h - 2, b.w, 2); // bottom
        ctx.fillRect(b.x + b.w - 2, b.y, 2, b.h); // right
        
        ctx.fillStyle = "#0a0a0a";
        ctx.fillRect(b.x, b.y + b.h - 1, b.w, 1); // bottom extreme
        ctx.fillRect(b.x + b.w - 1, b.y, 1, b.h); // right extreme

        // Health text
        ctx.fillStyle = "#000000";
        ctx.font = "bold 11px Tahoma";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 1);
    }

    // Draw Balls
    for (let ball of ib_balls) {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "#000000";
        ctx.stroke();
    }
}

function ib_loop(time) {
    if (!showingGame) return;
    
    let dt = (time - ib_lastTime) / 1000;
    ib_lastTime = time;
    if (dt > 0.1) dt = 0.1; // Cap dt to prevent clipping on lag

    ib_update(dt);
    ib_draw();
    
    ib_reqId = requestAnimationFrame(ib_loop);
}

</script>
